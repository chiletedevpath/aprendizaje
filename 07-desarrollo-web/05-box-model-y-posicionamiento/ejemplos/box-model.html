<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Box model</title>
<style>
* { box-sizing: border-box; }
.tarjeta { width: 18rem; padding: 1rem; border: 1px solid currentColor; margin: 1rem; }
.aviso { position: sticky; top: 0; padding: .5rem; background: white; }
</style></head><body><p class="aviso">El elemento permanece visible al alcanzar el borde superior.</p><article class="tarjeta"><h1>Box model</h1><p>El ancho declarado incluye contenido, padding y borde por `border-box`.</p></article></body></html>
