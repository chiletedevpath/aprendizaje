<style>
* { box-sizing: border-box; }

</style></head><body><p class="aviso">El elemento permanece visible al alcanzar el borde superior.</p><main><article class="tarjeta"><h1>Box model</h1><p><strong>Chilete DevPath explica:</strong> el ancho declarado incluye contenido, <code>padding</code> y borde por <code>border-box</code>; el aviso demuestra posicionamiento <code>sticky</code>.</p></article></main><footer><p>Ejemplo educativo de Chilete DevPath.</p></footer></body></html>
