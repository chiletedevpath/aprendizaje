<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cascada CSS</title>
  <style>
    :root { --espacio: 1rem; }
    p { font-size: 1rem; }
    .destacado { font-size: 1.25rem; }
    #principal { font-size: 1.5rem; }
    main { padding: var(--espacio); }
  </style>
</head>
<body>
  <main>
    <h1>Cascada y especificidad</h1>
    <p><strong>Chilete DevPath explica:</strong> cuando varias reglas compiten, el navegador compara su origen, importancia, especificidad y orden de aparición.</p>
    <!-- El selector por id tiene mayor especificidad que clase y elemento. -->
    <p id="principal" class="destacado">La especificidad decide entre reglas del mismo origen.</p>
  </main>
  <footer><p>Ejemplo educativo de Chilete DevPath.</p></footer>
</body>
</html>
