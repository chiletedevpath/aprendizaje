<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flujo básico de la web</title>
</head>
<body>
  <main>
    <h1>Del navegador al recurso</h1>
    <ol>
      <li>El usuario introduce una URL.</li>
      <li>El navegador determina a qué servidor debe conectarse.</li>
      <li>Envía una petición HTTP/HTTPS.</li>
      <li>El servidor devuelve una respuesta.</li>
      <li>El navegador interpreta HTML, CSS y JavaScript.</li>
    </ol>
  </main>
</body>
</html>
