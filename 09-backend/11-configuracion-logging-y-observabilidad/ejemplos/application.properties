spring.application.name=capacitaciones-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/capacitaciones}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El nivel INFO evita trazas excesivas como configuración predeterminada.
logging.level.root=${LOG_LEVEL:INFO}

# Actuator puede exponer únicamente endpoints necesarios para diagnóstico.
management.endpoints.web.exposure.include=health,info
