spring.application.name=autenticacion-con-jpa-h2
server.port=8080

# Base de datos H2 en memoria: se recrea cuando se reinicia la aplicación.
spring.datasource.url=jdbc:h2:mem:chilete_seguridad;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate reconstruye el esquema de esta práctica al iniciar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola didactica H2: usar solo en entorno local.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.demo.username=${DEMO_USERNAME:estudiante}
app.demo.password=${DEMO_PASSWORD:Aprende123!}
